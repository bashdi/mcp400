name: Release

# Builds mcp400.jar, mcp400-db.jar and mcp400-pgm.jar and attaches them to a GitHub release when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mcp400/target/mcp400.jar \
            mcp400-db/target/mcp400-db.jar \
            mcp400-pgm/target/mcp400-pgm.jar \
            --title "$GITHUB_REF_NAME" --generate-notes
